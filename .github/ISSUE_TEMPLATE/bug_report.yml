name: Bug report
description: Report a problem with X Living Business
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Resource version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework (Qbox / QBCore / ESX / standalone) and version
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: Server artifact version
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include steps to reproduce and what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console / F8 errors
      render: shell
